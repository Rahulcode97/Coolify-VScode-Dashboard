name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # trusted publishing (OIDC) to the VS Code Marketplace

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $v"; exit 1; }
      - run: npm run check
      - run: npm run package -- -o coolify-vscode-dashboard-${{ github.ref_name }}.vsix
      - run: node scripts/check-leaks.mjs --vsix coolify-vscode-dashboard-${{ github.ref_name }}.vsix
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release may already exist when the tag was made from the GitHub "Draft a new release" page.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" coolify-vscode-dashboard-*.vsix --clobber
          else
            gh release create "$GITHUB_REF_NAME" coolify-vscode-dashboard-*.vsix --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          fi
      - name: Publish to VS Code Marketplace (trusted publishing, no token)
        run: npx vsce publish --oidc --no-dependencies --packagePath coolify-vscode-dashboard-*.vsix
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish coolify-vscode-dashboard-*.vsix
