name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:leaks
      - run: npm run check:secrets
      - name: Package
        run: npm run package -- -o coolify-vscode-dashboard.vsix
      - name: Scan the packaged extension
        run: node scripts/check-leaks.mjs --vsix coolify-vscode-dashboard.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: coolify-vscode-dashboard.vsix
